name: Audit CHN 4.2.8 chemist and mulberry native damage fields
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/pvz2-two-plants-combat-audit.yml
      - scripts/catalog/audit_two_plants_combat.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pvz2-two-plants-combat-audit
  cancel-in-progress: false
jobs:
  verify_native_source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/archive/restore_git_shard.py
            scripts/catalog/audit_two_plants_combat.py
            Catalog/CHN/V4.2.8/shards/Internal-05/files.csv
            Unpack/CHN/V4.2.8/Internal/shard-05/
            Catalog/CHN/V4.2.8/two_plants_audit/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore verified raw gameplay JSON
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          python -m py_compile scripts/catalog/audit_two_plants_combat.py
          python scripts/archive/restore_git_shard.py \
            Unpack/CHN/V4.2.8/Internal/shard-05 \
            --out "$RUNNER_TEMP/real-internal05"
      - name: Verify exact native damage fields, no inferred runtime formulas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/catalog/audit_two_plants_combat.py \
            --raw-root "$RUNNER_TEMP/real-internal05" \
            --source-index Catalog/CHN/V4.2.8/shards/Internal-05/files.csv \
            --out Catalog/CHN/V4.2.8/two_plants_audit
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("Catalog/CHN/V4.2.8/two_plants_audit/focused_combat_source.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert len(data["source_files"])==4, data
          assert any("Mulberry" in (x["objclass"]+"".join(x["aliases"])) for x in data["records"])
          assert any("Convallaria" in (x["objclass"]+"".join(x["aliases"])) for x in data["records"])
          print("SOURCE_VERIFIED_TWO_PLANTS",len(data["records"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-two-plants-combat-source-audit
          path: Catalog/CHN/V4.2.8/two_plants_audit/
          retention-days: 14
      - name: Publish original numeric field evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "two-plants-audit-$GITHUB_RUN_ID"
          git add --sparse -f Catalog/CHN/V4.2.8/two_plants_audit/
          if git diff --cached --quiet; then
            echo "ALREADY_UP_TO_DATE"
            exit 0
          fi
          git commit -m "data(chn428): verified raw damage fields for chemist and mulberry"
          for attempt in 1 2 3 4 5 6; do
            git fetch --no-tags origin master
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/master; then
              echo "TWO_PLANTS_DAMAGE_AUDIT_PUBLISHED"
              exit 0
            fi
            sleep 6
          done
          exit 1
