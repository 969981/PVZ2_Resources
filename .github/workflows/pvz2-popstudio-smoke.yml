name: Validate authentic CN PTX PNG PAM and Wwise BNK
on:
  push:
    branches: [master]
    paths: [".github/workflows/pvz2-popstudio-smoke.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  real-media:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch pinned PopStudio and CN resource parser
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/PopStudio"
          git -C "$RUNNER_TEMP/PopStudio" remote add origin https://github.com/PopGameTool/PopStudio.git
          git -C "$RUNNER_TEMP/PopStudio" fetch --depth=1 origin a8bd1edd3e1dc4ec79e3b37ee29774e268438d85
          git -C "$RUNNER_TEMP/PopStudio" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/pvz2-tool"
          git -C "$RUNNER_TEMP/pvz2-tool" remote add origin https://github.com/lei1737524550/PVZ2-Chinese-Version-Reverse-Tools.git
          git -C "$RUNNER_TEMP/pvz2-tool" fetch --depth=1 origin 04f57f42080ef831545c9b2877f81f811f0be4e2
          git -C "$RUNNER_TEMP/pvz2-tool" checkout -q FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os
          f=Path(os.environ['RUNNER_TEMP'])/'PopStudio/PopStudio.ConsoleProject/Program.cs'
          text=f.read_text(encoding='utf-8-sig')
          assert text.count('while (true)')==1
          f.write_text(text.replace('while (true)','for (int once=0;once<1;once++)'),encoding='utf-8')
          PY
          dotnet build "$RUNNER_TEMP/PopStudio/PopStudio.ConsoleProject/PopStudio.ConsoleProject.csproj" -c Release -r linux-x64 --no-self-contained
      - uses: actions/download-artifact@v4
        with:
          run-id: 42256393599
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pvz2-chn-4.2.8-rsb-4
          path: ${{ runner.temp }}/rsb
      - name: Reconstruct 5 PTX using exact RSB table fields and extract 22 PAM + 2 BNK
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/pvz2-tool/Resource_Tool
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/media-result"
          python3 scripts/media/export_raw_media.py "$RUNNER_TEMP/rsb/dino.rsb" --out "$RUNNER_TEMP/raw-media"
          cp "$RUNNER_TEMP/raw-media/media_export_report.json" "$RUNNER_TEMP/media-result/raw_export.json"
      - name: Convert reconstructed PTX to PNG and PAM to JSON
        shell: bash
        run: |
          set -euo pipefail
          export PS_DLL="$(find "$RUNNER_TEMP/PopStudio/PopStudio.ConsoleProject/bin" -name PopStudio.dll -print -quit)"
          test -f "$PS_DLL"
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'raw-media'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'media-result'
          rows=[]
          for ext,opcode in (('.ptx','80'),('.pam','180')):
              inputs=sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower()==ext)
              for i,file in enumerate(inputs):
                  args=['dotnet',os.environ['PS_DLL'],str(file),opcode]
                  res=subprocess.run(args,text=True,capture_output=True,timeout=60)
                  target=file.with_suffix('.png' if ext=='.ptx' else '.pam.json')
                  record={'source':str(file.relative_to(root)),'opcode':opcode,'exit':res.returncode,'output':str(target.relative_to(root))}
                  record['log_excerpt']=(res.stdout+'\n'+res.stderr)[-1000:]
                  if target.is_file():
                      if ext=='.ptx':
                          with target.open('rb') as f:
                              signature=f.read(24)
                          record['verified']=signature[:8]==b'\x89PNG\r\n\x1a\n'
                      else:
                          with target.open('r',encoding='utf-8') as f:
                              json.load(f)
                          record['verified']=True
                      if record['verified'] and i<3:
                          import shutil
                          shutil.copy2(target,out/('sample_'+str(i)+'_'+target.name))
                  else:
                      record['verified']=False
                  rows.append(record)
          report={'ptx_png_success':sum(r['verified'] for r in rows if r['opcode']=='80'),
                  'pam_json_success':sum(r['verified'] for r in rows if r['opcode']=='180'),
                  'ptx_inputs':sum(r['opcode']=='80' for r in rows),
                  'pam_inputs':sum(r['opcode']=='180' for r in rows),'details':rows}
          (out/'popstudio_media.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='details'}))
          for row in rows:
              if not row['verified']: print('FAILED',row['source'],row['log_excerpt'][:400])
          assert report['ptx_png_success']>0 and report['pam_json_success']>0
          PY
      - name: Parse embedded Wwise banks and extract WEM
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,json,subprocess
          root=Path(os.environ['RUNNER_TEMP'])/'raw-media'
          out=Path(os.environ['RUNNER_TEMP'])/'media-result'
          banks=sorted(p for p in root.rglob('*.BNK') if p.is_file())
          report={'banks':len(banks),'wem_count':0,'errors':[]}
          for i,file in enumerate(banks):
              target=out/f"bnk_{i}"
              subprocess.run(['python3','scripts/media/parse_wwise_bnk.py',str(file),'--out',str(target)],
                             check=True)
              meta=json.loads((target/(file.stem+'.bnk.json')).read_text())
              report['wem_count']+=len(meta['wem'])
              report['errors']+=meta['errors']
          (out/'bnk_audit.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          assert not report['errors'] and report['wem_count']>0
          PY
      - name: Save verified sample metadata, PNG and PAM JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-real-ptx-pam-bnk
          path: |
            ${{ runner.temp }}/media-result/*.json
            ${{ runner.temp }}/media-result/sample_*
          if-no-files-found: warn
          retention-days: 3
