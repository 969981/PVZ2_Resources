name: PVZ2 CHN 4.2.8 read-only runtime signer and exit branch probe
on:
  push:
    branches: [experiment/chn428-original-vs-resign-ab-20261107]
    paths:
      - ".github/workflows/pvz2-offline-frida-signer-diff.yml"
      - "scripts/offline/frida_signer_trace.js"
      - "scripts/offline/frida_signer_probe.py"
      - "tests/test_offline_frida_signer_probe.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pvz2-chn428-frida-signer-branch-probe
  cancel-in-progress: false
jobs:
  original-vs-resigned:
    strategy:
      fail-fast: false
      matrix:
        variant: [original, direct-resigned]
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          submodules: false
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            ROMS/CHN/V4.2.8
      - name: Check telemetry parser never captures payloads
        run: python3 -m unittest discover -s tests -p test_offline_frida_signer_probe.py -v
      - name: Restore SHA-pinned original APK
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell || true
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y p7zip-full)
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          mkdir -p "$RUNNER_TEMP/restore-real" "$RUNNER_TEMP/frida-result"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/restore-real" -y
          apk="$(find "$RUNNER_TEMP/restore-real" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/original.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/original.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/restore-real" ROMS .git/objects
      - name: Prepare original or direct-resigned identity-controlled APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VARIANT" = "original" ]; then
            echo "TRIAL_APK=$RUNNER_TEMP/original.apk" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/local-key"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/local-key/qa.jks" \
              -storepass "isolated-test-only" -alias trial -keypass "isolated-test-only" \
              -keyalg RSA -keysize 3072 -validity 1 \
              -dname "CN=Frida A-B private research, O=Local, C=ZZ" >/dev/null 2>&1
            bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/local-key/qa.jks" \
              --ks-key-alias trial --ks-pass pass:isolated-test-only \
              --key-pass pass:isolated-test-only \
              --out "$RUNNER_TEMP/direct-resigned.apk" "$RUNNER_TEMP/original.apk"
            "$bt/apksigner" verify --verbose "$RUNNER_TEMP/direct-resigned.apk" >/dev/null
            echo "TRIAL_APK=$RUNNER_TEMP/direct-resigned.apk" >> "$GITHUB_ENV"
          fi
      - name: Prepare matching Frida 17.26.1 host and Android x86_64 server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/frida-venv"
          "$RUNNER_TEMP/frida-venv/bin/python" -m pip install --quiet --disable-pip-version-check \
            "frida==17.26.1" "frida-tools" "Pillow==11.3.0"
          "$RUNNER_TEMP/frida-venv/bin/frida" --version
          curl -fL --retry 3 --max-time 240 \
            "https://github.com/frida/frida/releases/download/17.26.1/frida-server-17.26.1-android-x86_64.xz" \
            -o "$RUNNER_TEMP/frida-server.xz"
          xz -dc "$RUNNER_TEMP/frida-server.xz" > "$RUNNER_TEMP/frida-server"
          chmod 700 "$RUNNER_TEMP/frida-server"
          rm -f "$RUNNER_TEMP/frida-server.xz"
      - name: Enable KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Boot isolated Android 11 and instrument without APK modification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16384M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            bash -lc 'set -euo pipefail;
            adb root;
            adb wait-for-device;
            adb push "$RUNNER_TEMP/frida-server" /data/local/tmp/frida-server >/dev/null;
            adb shell chmod 755 /data/local/tmp/frida-server;
            adb shell "(/data/local/tmp/frida-server >/dev/null 2>&1 &)";
            sleep 3;
            adb shell pidof frida-server;
            "$RUNNER_TEMP/frida-venv/bin/python"
            scripts/offline/frida_signer_probe.py
            --apk "$TRIAL_APK"
            --out "$RUNNER_TEMP/frida-result"
            --agent scripts/offline/frida_signer_trace.js
            --times 10,30,60,120'
      - name: Show only bounded category-level runtime evidence
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"frida-result/signer_runtime_trace_summary.json"
          d=json.loads(p.read_text()) if p.is_file() else {"status":"NO_RUNTIME_RESULT"}
          brief={"variant":os.environ["VARIANT"],"status":d["status"],
            "consent":d.get("consent_clicked",False),
            "frames":d.get("frames",[]),
            "read_only_trace":d.get("trace",{}),
            "menu":d.get("actual_menu_verified",False),
            "first_level":d.get("first_level_completed",False),
            "original_save":d.get("original_save_reloaded",False)}
          print(json.dumps(brief,ensure_ascii=False,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Private original-signature / re-sign read-only telemetry\n")
            f.write("- Variant: "+os.environ["VARIANT"]+"\n")
            f.write("- Runtime diagnostic: "+d["status"]+"\n")
            f.write("- Java bridge attached: "+str(d.get("trace",{}).get("java_hook_ready",False))+"\n")
            f.write("- Event category counts: "+str(d.get("trace",{}).get("event_counts",{}))+"\n")
            f.write("- Main menu, first level, original save **all unverified**.\n")
          PY
      - name: Upload only sanitized event categories and short-lived UI QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-frida-signer-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/frida-result/*.json
            ${{ runner.temp }}/frida-result/*.png
          if-no-files-found: warn
          retention-days: 1
