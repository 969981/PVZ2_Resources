name: PvZ2 CN 4.2.8 parallel stage1 unpack
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/unpack-chn-4.2.8.yml"
  workflow_dispatch:
    inputs:
      workers:
        description: Parallel RSLB workers (1-8)
        type: choice
        default: "4"
        options: ["1", "2", "3", "4", "6", "8"]
      publish_rsb:
        description: Upload temporary RSB artifacts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pvz2-chn-428-unpack
  cancel-in-progress: false

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - name: Checkout scripts and the original 88 split volumes
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            ROMS/CHN/V4.2.8
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Prepare disk and 7z
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache || true
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          7z l ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001 | tail -12
          df -h .

      - name: Recover APK and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pvz2-restore"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/pvz2-restore" -y
          apk="$(find "$RUNNER_TEMP/pvz2-restore" -type f -iname '*.apk' -print -quit)"
          if [ -z "$apk" ]; then echo "No APK found in 7z archive"; exit 1; fi
          mv -- "$apk" "$RUNNER_TEMP/PVZ2_4.2.8.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/pvz2-restore" ROMS .git/objects
          df -h .

      - name: Verify real dino small sample
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/unpack/parallel_unpack.py "$RUNNER_TEMP/PVZ2_4.2.8.apk" \
            --mode probe --out "$RUNNER_TEMP/pvz2-stage1" \
            --workers 2 --sha256 "$SOURCE_SHA"

      - name: Parallel all 33 RSLB bundles and 56 companion SMF files
        shell: bash
        env:
          REQUESTED_WORKERS: ${{ inputs.workers || '4' }}
        run: |
          set -euo pipefail
          python3 scripts/unpack/parallel_unpack.py "$RUNNER_TEMP/PVZ2_4.2.8.apk" \
            --mode all --out "$RUNNER_TEMP/pvz2-stage1" \
            --workers "$REQUESTED_WORKERS" --resume --sha256 "$SOURCE_SHA"
          df -h .

      - name: Partition outputs into eight balanced shards
        if: always()
        shell: bash
        run: |
          python3 scripts/unpack/partition_outputs.py "$RUNNER_TEMP/pvz2-stage1" \
            --out "$RUNNER_TEMP/pvz2-shards" --shards 8

      - name: Upload RTON, metadata and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-stage1-audit
          path: |
            ${{ runner.temp }}/pvz2-stage1/*.json
            ${{ runner.temp }}/pvz2-stage1/RTON/
            ${{ runner.temp }}/pvz2-stage1/SMF-Metadata/
            ${{ runner.temp }}/pvz2-shards/index.json
          if-no-files-found: warn
          compression-level: 6
          retention-days: 3

      - name: Upload RSB shard 0
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-0
          path: ${{ runner.temp }}/pvz2-shards/shard-0/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 1
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-1
          path: ${{ runner.temp }}/pvz2-shards/shard-1/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 2
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-2
          path: ${{ runner.temp }}/pvz2-shards/shard-2/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 3
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-3
          path: ${{ runner.temp }}/pvz2-shards/shard-3/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 4
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-4
          path: ${{ runner.temp }}/pvz2-shards/shard-4/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 5
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-5
          path: ${{ runner.temp }}/pvz2-shards/shard-5/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 6
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-6
          path: ${{ runner.temp }}/pvz2-shards/shard-6/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3

      - name: Upload RSB shard 7
        if: ${{ success() && (github.event_name == 'push' || inputs.publish_rsb) }}
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-rsb-7
          path: ${{ runner.temp }}/pvz2-shards/shard-7/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
