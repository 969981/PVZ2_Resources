name: PvZ2 CN 4.2.8 parallel internal and RTON JSON extraction
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/unpack-chn-4.2.8-internal.yml"
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed original RSB extraction workflow ID
        default: "42256393599"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pvz2-chn-428-internal
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned upstream Resource_Tool source
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/pvz2-tool"
          git -C "$RUNNER_TEMP/pvz2-tool" remote add origin https://github.com/lei1737524550/PVZ2-Chinese-Version-Reverse-Tools.git
          git -C "$RUNNER_TEMP/pvz2-tool" fetch --depth=1 origin 04f57f42080ef831545c9b2877f81f811f0be4e2
          git -C "$RUNNER_TEMP/pvz2-tool" checkout -q FETCH_HEAD
      - name: Download RSB shard 4 (contains dino.rsb)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run || '42256393599' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pvz2-chn-4.2.8-rsb-4
          path: ${{ runner.temp }}/rsb
      - name: Real dino RSB to internal members and JSON
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/pvz2-tool/Resource_Tool/main.py" \
            -unpack "$RUNNER_TEMP/rsb/dino.rsb" -json \
            -o "$RUNNER_TEMP/decoded-dino" -j 2
          python scripts/audit/report_secondary.py "$RUNNER_TEMP/decoded-dino" \
            --out "$RUNNER_TEMP/dino-secondary-report.json"
      - name: Upload dino conversion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-dino-json-audit
          path: ${{ runner.temp }}/dino-secondary-report.json
          retention-days: 3
          if-no-files-found: warn

  matrix:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch pinned Chinese Resource_Tool
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/pvz2-tool"
          git -C "$RUNNER_TEMP/pvz2-tool" remote add origin https://github.com/lei1737524550/PVZ2-Chinese-Version-Reverse-Tools.git
          git -C "$RUNNER_TEMP/pvz2-tool" fetch --depth=1 origin 04f57f42080ef831545c9b2877f81f811f0be4e2
          git -C "$RUNNER_TEMP/pvz2-tool" checkout -q FETCH_HEAD
      - name: Download RSB shard
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run || '42256393599' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pvz2-chn-4.2.8-rsb-${{ matrix.shard }}
          path: ${{ runner.temp }}/rsb
      - name: Batch-convert RSB through RSG and internal members into JSON (2 workers)
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/pvz2-tool/Resource_Tool/main.py" \
            -unpack "$RUNNER_TEMP/rsb" -json -o "$RUNNER_TEMP/decoded" -j 2
          python scripts/audit/report_secondary.py "$RUNNER_TEMP/decoded" \
            --out "$RUNNER_TEMP/secondary-audit.json"
      - name: Upload per-shard conversion audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-json-index-${{ matrix.shard }}
          path: ${{ runner.temp }}/secondary-audit.json
          retention-days: 3
          if-no-files-found: warn
      - name: Upload converted final internal resource files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-json-files-${{ matrix.shard }}
          path: ${{ runner.temp }}/decoded/*_JSON/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
