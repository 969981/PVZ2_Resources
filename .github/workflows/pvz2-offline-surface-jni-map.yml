name: PVZ2 CHN 4.2.8 original native surface JNI function map
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/chn428-offline-gate-20261107
    paths:
      - ".github/workflows/pvz2-offline-surface-jni-map.yml"
      - "scripts/offline/surface_jni_registration.py"
      - "tests/test_offline_surface_jni_registration.py"
permissions:
  contents: read
jobs:
  surface-jni-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          filter: blob:none
          sparse-checkout: |
            ROMS/CHN/V4.2.8
            scripts/offline/jni_registration_probe.py
            scripts/offline/surface_jni_registration.py
            tests/test_offline_surface_jni_registration.py
      - name: Pure synthetic native JNI parser test
        run: python3 -m unittest discover -s tests -p 'test_offline_surface_jni_registration.py' -v
      - name: SHA-locked original APK ARM64 JNI registration metadata
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell || true
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          mkdir -p "$RUNNER_TEMP/restore" "$RUNNER_TEMP/surface-jni-map"
          7z x ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001 "-o$RUNNER_TEMP/restore" -y
          apk="$(find "$RUNNER_TEMP/restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          echo "64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4  $apk" | sha256sum -c -
          python3 scripts/offline/surface_jni_registration.py \
            --apk "$apk" \
            --out "$RUNNER_TEMP/surface-jni-map/surface_jni_registration.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvz2-arm64-surface-jni-metadata
          path: ${{ runner.temp }}/surface-jni-map/*.json
          retention-days: 2
          if-no-files-found: warn
