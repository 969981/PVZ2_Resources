name: PvZ2 CHN repair media shards 1 and 3
on:
  push:
    branches: [master]
    paths: [".github/workflows/pvz2-media-repair.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pvz2-chn-428-secondary-media-repair
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1,3]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: scripts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ASTC decoder and pinned resource tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq astcenc
          git init -q "$RUNNER_TEMP/pvz2-tool"
          git -C "$RUNNER_TEMP/pvz2-tool" remote add origin https://github.com/lei1737524550/PVZ2-Chinese-Version-Reverse-Tools.git
          git -C "$RUNNER_TEMP/pvz2-tool" fetch --depth=1 origin 04f57f42080ef831545c9b2877f81f811f0be4e2
          git -C "$RUNNER_TEMP/pvz2-tool" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/PopStudio"
          git -C "$RUNNER_TEMP/PopStudio" remote add origin https://github.com/PopGameTool/PopStudio.git
          git -C "$RUNNER_TEMP/PopStudio" fetch --depth=1 origin a8bd1edd3e1dc4ec79e3b37ee29774e268438d85
          git -C "$RUNNER_TEMP/PopStudio" checkout -q FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import os
          f=Path(os.environ['RUNNER_TEMP'])/'PopStudio/PopStudio.ConsoleProject/Program.cs'
          text=f.read_text(encoding='utf-8-sig')
          assert text.count('while (true)')==1
          f.write_text(text.replace('while (true)','for (int once=0;once<1;once++)'),encoding='utf-8')
          PY
          dotnet build "$RUNNER_TEMP/PopStudio/PopStudio.ConsoleProject/PopStudio.ConsoleProject.csproj" \
            -c Release -r linux-x64 --no-self-contained
      - name: Download validated RSB source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 42256393599
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pvz2-chn-4.2.8-rsb-${{ matrix.shard }}
          path: ${{ runner.temp }}/rsb
      - name: Export actual raw media from each RSB and document origin
        shell: bash
        env:
          PYTHONPATH: ${{ runner.temp }}/pvz2-tool/Resource_Tool
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raw" "$RUNNER_TEMP/derived/Audit"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/rsb/*.rsb)
          test "${#inputs[@]}" -gt 0
          for source in "${inputs[@]}"; do
            python3 scripts/media/export_raw_media.py "$source" --out "$RUNNER_TEMP/raw"
            cp "$RUNNER_TEMP/raw/media_export_report.json" \
              "$RUNNER_TEMP/derived/Audit/$(basename "$source").json"
          done
      - name: Decode ASTC PTX to dimension-verified PNG (3 workers)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/media/ptx_astc_to_png.py "$RUNNER_TEMP/raw" \
            --out "$RUNNER_TEMP/derived/PNG" --workers 3 --allow-empty
      - name: Convert all actual PAM animation and BNK Wwise members
        shell: bash
        run: |
          set -euo pipefail
          dll="$(find "$RUNNER_TEMP/PopStudio/PopStudio.ConsoleProject/bin" -name PopStudio.dll -print -quit)"
          test -f "$dll"
          python3 scripts/media/convert_pam_bnk.py "$RUNNER_TEMP/raw" \
            --out "$RUNNER_TEMP/derived" --dotnet-dll "$dll" --workers 4
      - name: Verify failed BNK cases are preserved and all real conversions accounted
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          r=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'derived','pam_bnk_report.json')))
          c=r['summary']
          assert c.get('PAM_failed',0)==0 and c.get('BNK_failed',0)==0,c
          assert c.get('BNK_unresolved',0)==(1 if ${{ matrix.shard }}==1 else 0),c
          print('RESOLVED',c)
          PY
      - name: Final media counts, upload and failure audit
        if: always()
        shell: bash
        run: |
          echo "=== PNG ==="
          find "$RUNNER_TEMP/derived" -iname '*.png' | wc -l || true
          echo "=== PAM JSON ==="
          find "$RUNNER_TEMP/derived" -iname '*.pam.json' | wc -l || true
          echo "=== WEM ==="
          find "$RUNNER_TEMP/derived" -iname '*.wem' | wc -l || true
          df -h . || true
      - name: Upload converted media and inspectable reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn-4.2.8-media-repaired-${{ matrix.shard }}
          path: ${{ runner.temp }}/derived/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 3
