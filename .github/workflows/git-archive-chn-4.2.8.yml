name: PvZ2 CHN import remaining Git data shards
on:
  push:
    branches: [master]
    paths: [".github/workflows/git-archive-chn-4.2.8.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: scripts
          persist-credentials: true
      - name: Install zstd and configure Git
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
          gh --version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config gc.auto 0
          git switch -c archive-pvz2-428
      - name: Fetch and Git-commit all 23 outstanding resource shards
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          completed=0
          for stage in Internal RSB RSGP; do
            case "$stage" in
              Internal) source_run=42259266531; prefix=pvz2-chn-4.2.8-json-files ;;
              RSB) source_run=42256393599; prefix=pvz2-chn-4.2.8-rsb ;;
              RSGP) source_run=42258406327; prefix=pvz2-chn-4.2.8-rsg ;;
            esac
            for shard in 0 1 2 3 4 5 6 7; do
              if [[ "$stage" == Internal && "$shard" -eq 5 ]]; then
                echo "Existing verified archive: Internal 5"
                continue
              fi
              folder="$(printf '%02d' "$shard")"
              dest="Unpack/CHN/V4.2.8/$stage/shard-$folder"
              echo "::group::Import $stage shard $shard"
              git fetch --no-tags origin master
              if git cat-file -e "FETCH_HEAD:$dest/manifest.json" 2>/dev/null; then
                echo "Already committed to master; skipping $dest"
                echo "::endgroup::"
                continue
              fi
              mkdir -p "$RUNNER_TEMP/pvz2-artifact"
              gh run download "$source_run" \
                -R "$GITHUB_REPOSITORY" \
                -n "$prefix-$shard" -D "$RUNNER_TEMP/pvz2-artifact"
              python3 scripts/archive/import_actions_artifact.py \
                --input "$RUNNER_TEMP/pvz2-artifact" \
                --output-root Unpack/CHN/V4.2.8 \
                --stage "$stage" --shard "$shard" --temporary "$RUNNER_TEMP"
              git add --sparse -f -- "$dest"
              git commit -m "data(chn-4.2.8): archive $stage shard $shard"
              pushed=false
              for attempt in 1 2 3 4 5; do
                git fetch --no-tags origin master
                git rebase FETCH_HEAD
                if git push origin HEAD:refs/heads/master; then
                  pushed=true
                  break
                fi
                sleep 5
              done
              if [[ "$pushed" != true ]]; then
                echo "Failed to commit $dest after retries"
                exit 1
              fi
              rm -rf "$RUNNER_TEMP/pvz2-artifact"
              completed=$((completed + 1))
              echo "Git upload completed: $dest @ $(git rev-parse --short HEAD)"
              df -h .
              echo "::endgroup::"
            done
          done
          echo "Newly committed shards this execution: $completed"
      - name: Final Git archive status
        shell: bash
        run: |
          git log -1 --oneline
          echo "Check all 24 manifests under Unpack/CHN/V4.2.8"
