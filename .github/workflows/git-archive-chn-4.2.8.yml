name: PvZ2 git archive smoke import
on:
  push:
    branches: [master]
    paths: [".github/workflows/git-archive-chn-4.2.8.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: scripts
          persist-credentials: true
      - name: Download an existing 4.2.8 internal shard
        uses: actions/download-artifact@v4
        with:
          run-id: 42259266531
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: pvz2-chn-4.2.8-json-files-5
          path: ${{ runner.temp }}/pvz2-artifact
      - name: Install zstd and set Git author
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq zstd; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build verified Git-friendly archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/archive/import_actions_artifact.py \
            --input "$RUNNER_TEMP/pvz2-artifact" \
            --output-root Unpack/CHN/V4.2.8 \
            --stage Internal --shard 5 --temporary "$RUNNER_TEMP"
      - name: Commit and push the first real shard
        shell: bash
        run: |
          set -euo pipefail
          git switch -c pvz2-archive-internal-5
          git add --sparse -f -- Unpack/CHN/V4.2.8/Internal/shard-05
          git commit -m "data(chn-4.2.8): archive Internal shard 5 as verified Git parts"
          git fetch origin master
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/master
