name: PVZ2 CHN 4.2.8 full Smali project reconstruction and APK reassembly
on:
  workflow_dispatch:
  push:
    branches:
      - feature/chn428-reconstructed-smali-apk-build-20261107
    paths:
      - ".github/workflows/pvz2-offline-reconstructed-apk-build.yml"
      - "scripts/offline/reconstruct_ch428_project.sh"
permissions:
  contents: read
concurrency:
  group: pvz2-chn428-reassembled-apk
  cancel-in-progress: false
jobs:
  real-reconstruction:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
      APKTOOL_SHA: 66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa
    steps:
      - name: Checkout only build tools probes and original SHA-locked 88 archive volumes
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            ROMS/CHN/V4.2.8
      - name: Validate build script syntax before handling game bytes
        run: |
          bash -n scripts/offline/reconstruct_ch428_project.sh
          python3 -m compileall -q scripts/offline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Free runner space while retaining Android SDK and Java 21
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell || true
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y p7zip-full)
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          df -h .
      - name: Restore exact original APK from 88 Git volumes and verify full SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/restore" -y
          apk="$(find "$RUNNER_TEMP/restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/PVZ2_4.2.8_original.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8_original.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/restore" ROMS .git/objects
          df -h .
      - name: Fetch official SHA-pinned APKTool 2.12.1 and JADX 1.5.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools/jadx"
          curl -fL --retry 3 --max-time 240 "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o "$RUNNER_TEMP/tools/apktool.jar"
          echo "$APKTOOL_SHA  $RUNNER_TEMP/tools/apktool.jar" | sha256sum -c -
          curl -fL --retry 3 --max-time 240 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o "$RUNNER_TEMP/tools/jadx.zip"
          unzip -q "$RUNNER_TEMP/tools/jadx.zip" -d "$RUNNER_TEMP/tools/jadx"
          java -jar "$RUNNER_TEMP/tools/apktool.jar" --version
          "$RUNNER_TEMP/tools/jadx/bin/jadx" --version
      - name: Restore complete APK member tree and all six Java/Smali DEX sources, then actually rebuild APK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/offline/reconstruct_ch428_project.sh \
            "$RUNNER_TEMP/PVZ2_4.2.8_original.apk" \
            "$RUNNER_TEMP/private-reconstructed" \
            "$RUNNER_TEMP/tools/apktool.jar" \
            "$RUNNER_TEMP/tools/jadx/bin/jadx"
          python3 - <<'PY'
          import json,os,pathlib
          report=pathlib.Path(os.environ["RUNNER_TEMP"])/"private-reconstructed/reports/reassembly_report.json"
          d=json.loads(report.read_text())
          assert d["recompiled_dex_count"]==6
          assert d["java_reference_files"]>=7000
          assert d["smali_files"]>=7000
          assert d["non_dex_members_preserved_by_crc_and_size"]>1000
          print("REAL_SIGNED_REBUILT_APK_READY_NOT_GAMEPLAY_VERIFIED")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Real CHN 4.2.8 APK code recovery and rebuild\n\n")
            f.write("- Java reference: "+str(d["java_reference_files"])+" files\n")
            f.write("- Smali: "+str(d["smali_files"])+" files\n")
            f.write("- DEX rebuilt: "+str(d["recompiled_dex_count"])+"\n")
            f.write("- Preserved original non-DEX members: "+str(d["non_dex_members_preserved_by_crc_and_size"])+"\n")
            f.write("- Result: **test-signed APK constructed, NOT verified playable**\n")
            f.write("- Native C++ source cannot be reconstructed from ARM64 binary.\n")
          PY
      - name: Prepare Android emulator screenshot decoder
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/python" -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
      - name: Enable KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Install rebuilt signed APK on clean Android 11 in airplane mode and inspect real consent flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16384M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            "$RUNNER_TEMP/qa-venv/bin/python" scripts/offline/consent_probe.py
            --apk "$RUNNER_TEMP/private-reconstructed/build/PVZ2_CHN_4.2.8_reassembled_test.apk"
            --out "$RUNNER_TEMP/reconstructed-qa"
            --checkpoints 5,25,60,120
      - name: Report real APK build and Android evidence without claiming gameplay success
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          rp=root/"private-reconstructed/reports/reassembly_report.json"
          qp=root/"reconstructed-qa/consent_probe.json"
          d=json.loads(rp.read_text()) if rp.is_file() else {"status":"NO_REBUILT_APK"}
          q=json.loads(qp.read_text()) if qp.is_file() else {"status":"NO_ANDROID_QA"}
          output={"reconstruction":d.get("status"),"java_count":d.get("java_reference_files"),
             "smali_count":d.get("smali_files"),
             "signed_apk_exists":d.get("status")=="REASSEMBLED_SIGNED_NOT_PLAYABILITY_VERIFIED",
             "android_status":q.get("status"),"android_privacy_consent_clicked":q.get("consent_clicked",False),
             "actual_main_menu_verified":False,"first_level_completed":False,
             "original_save_reloaded":False}
          (root/"rebuild_final_result.json").write_text(json.dumps(output,indent=2)+"\n")
          print(json.dumps(output,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("\n## Emulator acceptance\n\n")
            f.write("- Android result: "+output["android_status"]+"\n")
            f.write("- Actual original menu, first level and original save: **UNVERIFIED**\n")
          PY
      - name: Upload summary metadata only, never full proprietary source or rebuilt APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-reassembled-code-and-apk-qa-metadata
          path: |
            ${{ runner.temp }}/private-reconstructed/reports/*.json
            ${{ runner.temp }}/rebuild_final_result.json
            ${{ runner.temp }}/reconstructed-qa/*.json
            ${{ runner.temp }}/reconstructed-qa/*.png
          if-no-files-found: warn
          retention-days: 7
