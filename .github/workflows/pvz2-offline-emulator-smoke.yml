name: PVZ2 CHN 4.2.8 Android offline emulator smoke
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pvz2-offline-emulator-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvz2-chn428-offline-emulator
  cancel-in-progress: false

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            ROMS/CHN/V4.2.8
          sparse-checkout-cone-mode: true
      - name: Run emulator smoke synthetic unit tests
        run: python3 -m unittest discover -s tests -p test_offline_emulator.py -v
      - name: Free runner disk and ensure 7zip
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache || true
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
      - name: Restore source 4.2.8 APK and check SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pvz2-restore"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/pvz2-restore" -y
          apk="$(find "$RUNNER_TEMP/pvz2-restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/PVZ2_4.2.8.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/pvz2-restore" ROMS .git/objects
          df -h .
      - name: Enable KVM permissions if present
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "::warning::No KVM on runner; emulator might be slow."
          fi
      - name: Boot Android 11 emulator and attempt ARM-only game launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 10240M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            python3 scripts/offline/emulator_smoke.py --apk "$RUNNER_TEMP/PVZ2_4.2.8.apk" --out "$RUNNER_TEMP/pvz2-offline-emulator" --observe-seconds 25
            python3 - <<'PY'
            import json,os,pathlib
            p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pvz2-offline-emulator/emulator_smoke.json"
            d=json.loads(p.read_text(encoding="utf-8"))
            print("EMULATOR_RESULT:",d["status"])
            with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
                f.write("## Real PVZ2 CHN 4.2.8 offline emulator check\n\n")
                f.write("- Diagnostic status: **"+d["status"]+"**\n")
                f.write("- Emulator ABI: "+d.get("emulator",{}).get("ro.product.cpu.abilist","unavailable")+"\n")
                f.write("- Native bridge: "+d.get("emulator",{}).get("ro.dalvik.vm.native.bridge","unavailable")+"\n")
                f.write("- Playable offline: **not verified**\n")
            PY
      - name: Upload sanitized emulator evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-offline-emulator-smoke
          path: ${{ runner.temp }}/pvz2-offline-emulator/emulator_smoke.json
          if-no-files-found: warn
          retention-days: 7
