name: PVZ2 CHN 4.2.8 fast native login status/JString argument probe

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pvz2-offline-native-jni-argument-probe.yml"
      - "scripts/offline/arm64_native_login_arg_probe.py"
      - "tests/test_offline_arm64_native_login_args.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvz2-chn428-native-jni-argument-probe
  cancel-in-progress: false

jobs:
  real-apk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - name: Checkout offline scripts and original 88 split volumes
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
            ROMS/CHN/V4.2.8
          sparse-checkout-cone-mode: true

      - name: Prepare runner disk and 7-Zip
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache || true
          # Keep ANDROID_HOME/build-tools for aapt2 Manifest identity verification.
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          count="$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)"
          test "$count" -eq 88

      - name: Restore original APK and verify source SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-pvz2"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/restore-pvz2" -y
          apk="$(find "$RUNNER_TEMP/restore-pvz2" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv -- "$apk" "$RUNNER_TEMP/PVZ2_4.2.8.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/restore-pvz2" ROMS .git/objects
          df -h .

      - name: Set up isolated Capstone disassembler in temporary venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-audit-venv"
          "$RUNNER_TEMP/native-audit-venv/bin/python" -m pip install --disable-pip-version-check "capstone==5.0.6"
          "$RUNNER_TEMP/native-audit-venv/bin/python" -m unittest discover -s tests -p test_offline_arm64_native_login_args.py -v

      - name: Extract only exact ARM64 libSrc.so into untracked private scratch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-private"
          python3 - <<'PY'
          import os,pathlib,zipfile,shutil
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          with zipfile.ZipFile(root/"PVZ2_4.2.8.apk") as apk:
              info=apk.getinfo("lib/arm64-v8a/libSrc.so")
              assert info.file_size>70*1024*1024
              with apk.open(info) as src,(root/"native-private/libSrc-arm64.so").open("wb") as dest:
                  shutil.copyfileobj(src,dest,4*1024*1024)
          PY

      - name: Decode native login argument register first-use and bounded constants
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/native-audit-venv/bin/python" scripts/offline/arm64_native_login_arg_probe.py \
            --so "$RUNNER_TEMP/native-private/libSrc-arm64.so" \
            --out "$RUNNER_TEMP/native-arg-derived"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"native-arg-derived/arm64_jni_status_probe.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          assert len(d["entry_methods"])==4, "Source login JNI methods not fully recovered"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("## PVZ2 CHN 4.2.8 native JNI argument first-use analysis\n")
              f.write("- Source table entries: "+str(len(d["entry_methods"]))+"\n")
              f.write("- Direct JNI register inputs: "+str(d["first_reads_count"])+"\n")
              f.write("- Small compare constant hints: "+str(d["small_comparison_rows"])+"\n")
              f.write("- Static evidence only, no login player-state or game patch proof.\n")
          PY

      - name: Upload derived register-use metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-native-login-arg-uses
          path: ${{ runner.temp }}/native-arg-derived/
          if-no-files-found: warn
          retention-days: 7
