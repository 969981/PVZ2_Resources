name: PVZ2 CHN 4.2.8 original bytecode resign-only control

on:
  push:
    branches:
      - master
      - experiment/chn428-resign-only-control
    paths:
      - ".github/workflows/pvz2-offline-resign-only-control.yml"
      - "scripts/offline/patch_tw_local_trial.py"
      - "tests/test_offline_tw_local_trial.py"
      - "scripts/offline/build_private_local_trial.sh"
      - "scripts/offline/local_trial_gameplay_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvz2-chn428-resign-only-control
  cancel-in-progress: false

jobs:
  isolate-build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - name: Checkout only offline scripts, synthetic tests and original 88 7z volumes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            scripts
            tests
            ROMS/CHN/V4.2.8

      - name: Validate the trial patch strictly against synthetic smali layout
        run: python3 -m unittest discover -s tests -p test_offline_tw_local_trial.py -v

      - name: Clean runner without deleting Android build-tools or JDK
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell || true
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore exact original APK SHA before all modification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pvz2-restore"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/pvz2-restore" -y
          apk="$(find "$RUNNER_TEMP/pvz2-restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/PVZ2_4.2.8.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/pvz2-restore" ROMS .git/objects
          "$JAVA_HOME/bin/java" -version
          df -h .

      - name: Re-sign unmodified APK for package-signature control
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/resign-control"
          mkdir -p "$work" "$RUNNER_TEMP/resign-report"
          cp "$RUNNER_TEMP/PVZ2_4.2.8.apk" "$work/unsigned.apk"
          for name in 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/*.SF' 'META-INF/MANIFEST.MF'; do
            zip -qd "$work/unsigned.apk" "$name" 2>/dev/null || true
          done
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$bt/zipalign"
          test -x "$bt/apksigner"
          "$bt/zipalign" -f -p 4 "$work/unsigned.apk" "$work/aligned.apk"
          "$bt/zipalign" -c -p 4 "$work/aligned.apk"
          keytool -genkeypair -noprompt -keystore "$work/key.jks" -storepass "isolated-test-only" \
            -alias trial -keypass "isolated-test-only" -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=Test signing control, O=Private Research, C=ZZ" >/dev/null 2>&1
          "$bt/apksigner" sign --ks "$work/key.jks" --ks-key-alias trial \
            --ks-pass pass:isolated-test-only --key-pass pass:isolated-test-only \
            --out "$work/PVZ2_4.2.8_resign_only.apk" "$work/aligned.apk"
          "$bt/apksigner" verify --verbose "$work/PVZ2_4.2.8_resign_only.apk" > "$RUNNER_TEMP/resign-report/signature_check.txt"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=root/"PVZ2_4.2.8.apk"; b=root/"resign-control/PVZ2_4.2.8_resign_only.apk"
          unchanged=[]
          with zipfile.ZipFile(a) as za,zipfile.ZipFile(b) as zb:
              for name in ["classes.dex","classes2.dex","classes3.dex","classes4.dex","classes5.dex","classes6.dex",
                           "lib/arm64-v8a/libSrc.so"]:
                  first=hashlib.sha256(za.read(name)).hexdigest()
                  second=hashlib.sha256(zb.read(name)).hexdigest()
                  assert first==second, f"Code not identical: {name}"
                  unchanged.append({"entry":name,"sha256":first})
          output={"status":"SAME_DEX_AND_NATIVE_BYTES_RESIGNED_PACKAGE",
                  "apk_original_sha256":hashlib.sha256(a.read_bytes()).hexdigest(),
                  "resigned_apk_sha256":hashlib.sha256(b.read_bytes()).hexdigest(),
                  "verified_unchanged_code":unchanged,
                  "original_gameplay_unchanged":True}
          (root/"resign-report/resign_only_control.json").write_text(json.dumps(output,indent=2)+"\n")
          print("All six DEX + arm64 libSrc exact bytes preserved.")
          PY

      - name: Prepare private screenshot decoder
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/visual-venv"
          "$RUNNER_TEMP/visual-venv/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enable hardware KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Install unmodified re-signed APK and observe post-consent process survival
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16384M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            "$RUNNER_TEMP/visual-venv/bin/python" scripts/offline/local_trial_gameplay_probe.py
            --apk "$RUNNER_TEMP/resign-control/PVZ2_4.2.8_resign_only.apk"
            --out "$RUNNER_TEMP/trial-qa-screens"
            --times 10,30,60,120,360,600

      - name: State precise end-to-end verification results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          p=root/"trial-qa-screens/local_trial_ui_qa.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              if not p.exists():
                  f.write("No full Android QA result; see failed build or emulator logs.\n")
              else:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  f.write("\n## Real offline gameplay acceptance\n\n")
                  f.write("- Android QA status: **"+d["status"]+"**\n")
                  f.write("- APK installed: "+str(d["install_success"])+"\n")
                  f.write("- Airplane mode: "+str(d.get("airplane_mode_after"))+"\n")
                  for item in d["frames"]:
                      f.write(f"- {item['name']}: {item.get('visual_classification','unknown')}\n")
                  f.write("- Main menu **verified**: "+str(d["actual_main_menu_verified"])+"\n")
                  f.write("- First level **completed**: "+str(d["first_level_completed"])+"\n")
                  f.write("- Original save **reloaded**: "+str(d["original_game_save_reloaded"])+"\n")
          PY

      - name: Check that unchanged-bytecode re-signed control remains alive
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"trial-qa-screens/local_trial_ui_qa.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          assert any(f.get("process_alive") and f.get("target_offset_seconds",0)>=120 for f in d["frames"]), "UNCHANGED_CODE_RESIGN_APP_EXITED_BEFORE_120S"
          PY

      - name: Upload only screenshots, bounded metadata and verification evidence, not private APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-original-bytecode-resign-control
          path: |
            ${{ runner.temp }}/resign-report/*.json
            ${{ runner.temp }}/resign-report/*.txt
            ${{ runner.temp }}/trial-qa-screens/*.json
            ${{ runner.temp }}/trial-qa-screens/*.png
          if-no-files-found: warn
          retention-days: 1
