name: PVZ2 CHN 4.2.8 Ghidra native onSurfaceCreated callgraph
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/chn428-offline-gate-20261107
    paths:
      - ".github/workflows/pvz2-offline-ghidra-surface-init.yml"
      - "scripts/offline/ghidra/PvZ2SurfaceBranchIndex.java"
      - "scripts/offline/rank_surface_branch_candidates.py"
permissions:
  contents: read
jobs:
  surface-native:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            ROMS/CHN/V4.2.8
            scripts/offline/arm64_xrefs.py
            scripts/offline/jni_registration_probe.py
            scripts/offline/surface_jni_registration.py
            scripts/offline/ghidra
            scripts/offline/rank_surface_branch_candidates.py
      - name: Recover verified original APK and prepare Ghidra inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache || true
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y p7zip-full
          fi
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          mkdir -p "$RUNNER_TEMP/pvz2-restore" "$RUNNER_TEMP/ghidra-derived"
          7z x ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001 "-o$RUNNER_TEMP/pvz2-restore" -y
          apk="$(find "$RUNNER_TEMP/pvz2-restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/PVZ2_4.2.8.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/PVZ2_4.2.8.apk" | sha256sum -c -
          python3 scripts/offline/arm64_xrefs.py \
            --apk "$RUNNER_TEMP/PVZ2_4.2.8.apk" \
            --scratch "$RUNNER_TEMP/ghidra-private" \
            --out "$RUNNER_TEMP/ghidra-derived"
          python3 scripts/offline/surface_jni_registration.py \
            --apk "$RUNNER_TEMP/PVZ2_4.2.8.apk" \
            --out "$RUNNER_TEMP/ghidra-derived/surface_jni_registration.json"
          python3 - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"ghidra-derived"
          report=json.loads((root/"surface_jni_registration.json").read_text())
          entries=[r for r in report["registration_candidates"]
                   if r["native_java_method"]=="Native_onSurfaceCreated"
                   and r["jni_signature"]=="()V"]
          assert len(entries)==1, "Requires exactly one structurally validated JNI entry"
          entry=entries[0]
          assert entry["native_function_candidate_rva"]=="0x5722ff0"
          fields=["domain_hint","native_literal_rva_hex","code_reference_rva_hex",
                  "followup_add_rva_hex","instruction_pattern","warning"]
          out=root/"surface_native_function_sites.csv"
          with out.open("w",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              w.writerow({
                  "domain_hint":"JNI:Native_onSurfaceCreated",
                  "native_literal_rva_hex":entry["name_literal_elf_rva"],
                  "code_reference_rva_hex":entry["native_function_candidate_rva"],
                  "followup_add_rva_hex":"",
                  "instruction_pattern":"JNINativeMethod_fnPtr",
                  "warning":"Structural mapping only; actual guard branch not proven"})
          PY
          rm -rf "$RUNNER_TEMP/pvz2-restore" ROMS .git/objects
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Obtain verified Ghidra 12.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 600 \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/ghidra_12.1.3_PUBLIC_20260817.zip" \
            -o "$RUNNER_TEMP/ghidra.zip"
          echo "93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54  $RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
      - name: Analyze original ELF surface-creation function boundary
        shell: bash
        run: |
          set -euo pipefail
          headless="$(find "$RUNNER_TEMP/ghidra" -type f -name analyzeHeadless | head -1)"
          test -n "$headless"
          chmod +x "$headless"
          mkdir -p "$RUNNER_TEMP/ghidra-projects"
          timeout 1800 "$headless" \
            "$RUNNER_TEMP/ghidra-projects" PVZ2_CHN_428_SURFACE \
            -import "$RUNNER_TEMP/ghidra-private/libSrc-arm64.so" \
            -scriptPath "$GITHUB_WORKSPACE/scripts/offline/ghidra" \
            -postScript PvZ2CodeXrefs.java \
              "$RUNNER_TEMP/ghidra-derived/surface_native_function_sites.csv" \
              "$RUNNER_TEMP/ghidra-derived/surface_function_refs.csv" \
            -postScript PvZ2SurfaceBranchIndex.java \
              "0x5722ff0" \
              "$RUNNER_TEMP/ghidra-derived/surface_branch_index.csv" \
            -analysisTimeoutPerFile 1000 -max-cpu 2 -deleteProject
          python3 - <<'PY'
          import csv,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"ghidra-derived"
          with (root/"surface_function_refs.csv").open(encoding="utf-8") as f:
              records=list(csv.DictReader(f))
          branches=root/"surface_branch_index.csv"
          assert branches.is_file() and branches.stat().st_size>50, "Missing Ghidra branch index"
          with branches.open(encoding="utf-8") as f:
              indexed=list(csv.DictReader(f))
          assert len(indexed)>20, "Expected native initialization call/branch metadata"
          assert indexed[0]["type"]=="entry", "Missing verified JNI inside-function pointer"
          assert indexed[0]["instruction_address"]=="05722ff0", "Ghidra mapped unexpected JNI address"
          assert len(records)==1, "Expected one exact JNI source-verified entry"
          row=records[0]
          report={
              "status":"GHIDRA_SURFACE_FUNCTION_BOUNDARY_ANALYZED",
              "source_original_sha_verified":True,
              "elf_libsrc_verified":True,
              "native_entry_candidate_rva":"0x5722ff0",
              "mapped_address":row["mapped_instruction_address"],
              "function_entry":row["function_entry"],
              "function_name":row["function_name"],
              "caller_count":row["caller_count"],
              "callee_count":row["callee_count"],
              "function_num_addresses":row["function_num_addresses"],
              "direct_and_indirect_call_insns":sum("call" in x["type"] for x in indexed),
              "conditional_branch_insns":sum("branch" in x["type"] for x in indexed),
              "branch_index_filename":"surface_branch_index.csv",
              "runtime_branch_verified":False,
              "safe_offline_patch_verified":False,
              "gameplay_verified":False
          }
          (root/"surface_function_summary.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(report))
          assert row["function_name"]!="UNRESOLVED" and row["mapped_instruction_address"]!="NO_DISASSEMBLY", \
              "Surface JNI entry not confirmed by Ghidra function analysis"
          PY
          python3 scripts/offline/rank_surface_branch_candidates.py \
            --in-csv "$RUNNER_TEMP/ghidra-derived/surface_branch_index.csv" \
            --out "$RUNNER_TEMP/ghidra-derived/ranked_surface_branch_candidates.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pvz2-arm64-surface-ghidra-callgraph
          path: |
            ${{ runner.temp }}/ghidra-derived/surface_jni_registration.json
            ${{ runner.temp }}/ghidra-derived/surface_function_refs.csv
            ${{ runner.temp }}/ghidra-derived/surface_branch_index.csv
            ${{ runner.temp }}/ghidra-derived/ranked_surface_branch_candidates.json
            ${{ runner.temp }}/ghidra-derived/surface_function_summary.json
          retention-days: 2
          if-no-files-found: warn
