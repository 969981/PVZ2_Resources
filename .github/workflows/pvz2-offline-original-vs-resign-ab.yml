name: PVZ2 CHN 4.2.8 matched original vs direct-resigned A/B test

on:
  push:
    branches:
      - experiment/chn428-original-vs-resign-ab-20261107
    paths:
      - ".github/workflows/pvz2-offline-original-vs-resign-ab.yml"
      - "scripts/offline/consent_probe.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pvz2-chn428-original-vs-resign-ab
  cancel-in-progress: false

jobs:
  matched-emulator-control:
    strategy:
      fail-fast: false
      matrix:
        variant: [original, direct-resigned]
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      SOURCE_SHA: 64b0f2cddb6221baf35fb32d4a0f6e64153428edf5ee5922beddb9726bedbda4
    steps:
      - name: Checkout source volumes and read-only Android probes
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          submodules: false
          sparse-checkout: |
            scripts
            ROMS/CHN/V4.2.8
      - name: Restore SHA-pinned original APK and free working space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell || true
          command -v 7z >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y p7zip-full)
          test "$(find ROMS/CHN/V4.2.8 -maxdepth 1 -name 'PVZ2_4.2.8.7z.*' | wc -l)" -eq 88
          mkdir -p "$RUNNER_TEMP/apk-restore"
          7z x "ROMS/CHN/V4.2.8/PVZ2_4.2.8.7z.001" "-o$RUNNER_TEMP/apk-restore" -y
          apk="$(find "$RUNNER_TEMP/apk-restore" -type f -iname '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" "$RUNNER_TEMP/ground_truth.apk"
          echo "$SOURCE_SHA  $RUNNER_TEMP/ground_truth.apk" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/apk-restore" ROMS .git/objects
      - name: Prepare exact A/B install input
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ab-evidence"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$bt/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/ground_truth.apk" > "$RUNNER_TEMP/ab-evidence/original_cert.txt"
          if [ "$VARIANT" = original ]; then
            echo "TRIAL_APK=$RUNNER_TEMP/ground_truth.apk" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ab-key.jks" -storepass "isolated-only-test" \
              -alias local -keypass "isolated-only-test" -keyalg RSA -keysize 3072 -validity 1 \
              -dname "CN=Private A-B experiment, O=Research, C=ZZ" >/dev/null 2>&1
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/ab-key.jks" --ks-key-alias local \
              --ks-pass pass:isolated-only-test --key-pass pass:isolated-only-test \
              --out "$RUNNER_TEMP/direct_resigned.apk" "$RUNNER_TEMP/ground_truth.apk"
            "$bt/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/direct_resigned.apk" > "$RUNNER_TEMP/ab-evidence/resigned_cert.txt"
            echo "TRIAL_APK=$RUNNER_TEMP/direct_resigned.apk" >> "$GITHUB_ENV"
          fi
          python3 - <<'PY'
          import os,hashlib,json,zipfile,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          orig=root/"ground_truth.apk"
          path=orig if os.environ["VARIANT"]=="original" else root/"direct_resigned.apk"
          names=["classes.dex","classes2.dex","classes3.dex","classes4.dex","classes5.dex","classes6.dex","lib/arm64-v8a/libSrc.so"]
          with zipfile.ZipFile(orig) as source,zipfile.ZipFile(path) as trial:
            checks={name:hashlib.sha256(source.read(name)).hexdigest()==hashlib.sha256(trial.read(name)).hexdigest() for name in names}
            assert all(checks.values()), "Resign altered a code entry"
            a={i.filename:i for i in source.infolist()};b={i.filename:i for i in trial.infolist()}
            nonmeta=[k for k in a if not k.startswith("META-INF/") and k in b]
            offset_same=sum(a[k].header_offset==b[k].header_offset for k in nonmeta)
          def sha(p):
            h=hashlib.sha256()
            with p.open("rb") as f:
              for block in iter(lambda:f.read(4*1024*1024),b""):h.update(block)
            return h.hexdigest()
          d={"variant":os.environ["VARIANT"],"original_sha256":sha(orig),"trial_sha256":sha(path),
             "code_entries_identical":checks,"nonmeta_members":len(nonmeta),
             "nonmeta_header_offsets_preserved":offset_same,
             "gameplay_verification":"PENDING_ACTUAL_EMULATOR"}
          (root/"ab-evidence/identity.json").write_text(json.dumps(d,indent=2)+"\n")
          print(json.dumps(d,indent=2))
          PY
      - name: Install Pillow and configure KVM
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ab-venv"
          "$RUNNER_TEMP/ab-venv/bin/python" -m pip install --quiet --disable-pip-version-check Pillow==11.3.0
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Observe identical clean Android 11 offline consent path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 16384M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: >-
            "$RUNNER_TEMP/ab-venv/bin/python" scripts/offline/local_trial_gameplay_probe.py
            --apk "$TRIAL_APK"
            --out "$RUNNER_TEMP/ab-evidence/qa"
            --times 10,30,60,120
      - name: Record A/B result, preserving failed gameplay gates
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"ab-evidence"
          p=root/"qa/local_trial_ui_qa.json"
          d=json.loads(p.read_text()) if p.exists() else {"status":"NO_RUN_EVIDENCE"}
          f=[{"time":x.get("target_offset_seconds"),"alive":x.get("process_alive"),
              "screen":x.get("visual_classification")} for x in d.get("frames",[])]
          result={"variant":os.environ["VARIANT"],"status":d["status"],
             "consent_clicked":d.get("policy_consent_clicked",False),
             "airplane_mode":d.get("airplane_mode_after"),
             "frames":f,"exit_observation":d.get("process_exit_observation"),
             "main_menu_verified":False,"first_level_verified":False,"original_save_verified":False}
          (root/"ab_result.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
            out.write("## Matched Android flight-mode experiment: "+result["variant"]+"\n\n")
            out.write("- Result: **"+result["status"]+"**\n")
            out.write("- Privacy consent: "+str(result["consent_clicked"])+"\n")
            out.write("- Observations: "+str(f)+"\n")
            out.write("- Menu/level/original-save: **not verified**\n")
          PY
      - name: Upload bounded metadata and screenshots only (not private APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pvz2-chn428-ab-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/ab-evidence/*.json
            ${{ runner.temp }}/ab-evidence/qa/*.json
            ${{ runner.temp }}/ab-evidence/qa/*.png
          if-no-files-found: warn
          retention-days: 1
